[package]
name = "claude-agent-kit"
description = "Rust SDK for building Claude Agent applications on top of the Claude CLI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
keywords = ["claude", "agent", "sdk", "anthropic", "ai"]
categories = ["api-bindings", "asynchronous"]
readme = "../../README.md"
exclude = ["tests/workspace.rs"]

[features]
default = ["jsonschema"]
jsonschema = ["dep:jsonschema"]
macros = ["dep:claude-agent-kit-macros"]
otel = ["dep:opentelemetry"]
rmcp = ["dep:rmcp"]
testing = []

[dependencies]
claude-agent-kit-macros = { path = "../claude-agent-kit-macros", version = "0.1.0", optional = true }
futures-core.workspace = true
futures-util.workspace = true
indexmap.workspace = true
jsonschema = { workspace = true, optional = true }
opentelemetry = { workspace = true, optional = true }
rmcp = { workspace = true, optional = true }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt", "sync", "time"] }
tracing.workspace = true
unicode-normalization.workspace = true
unicode-properties.workspace = true
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
opentelemetry_sdk.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "test-util", "time"] }
trybuild.workspace = true

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
