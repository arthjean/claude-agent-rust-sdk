[package]
name = "claude-agent-kit"
description = "Rust SDK for building Claude Agent applications on top of the Claude CLI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
keywords = ["claude", "agent", "sdk", "anthropic", "ai"]
categories = ["api-bindings", "asynchronous"]
exclude = ["tests/workspace.rs"]

[features]
testing = []

[dependencies]
futures-core.workspace = true
futures-util.workspace = true
indexmap.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt", "sync", "time"] }
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time"] }

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
