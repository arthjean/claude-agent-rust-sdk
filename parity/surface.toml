# Surface ledger: every name of the upstream `__all__`
# (upstream/claude-agent-sdk-python/src/claude_agent_sdk/__init__.py) with
# the Rust path that replaces it, or the key of an `[exclusions]` reason.
#
# `cargo xtask parity-check` fails when upstream exports a name this file
# does not list, and when a Rust path listed here does not compile.
# `cargo xtask migration-table` renders this file into docs/migration.md.
#
# Each name sets exactly one of `rust`, `adapted`, `excluded`, `pending`.
# Decision rule between `rust` and `adapted`:
#
# - `rust`: the Rust item is the same kind of item as the Python one, so a
#   ported line names it where Python named the original. A function
#   becomes a function, a constant a constant, and a class a type of its
#   own: a struct, an enum, or a trait. A dictionary type (TypedDict or a
#   union of them) becomes a struct or an enum, which counts as the same
#   kind as long as it keeps the keys it does not model.
# - `adapted`: the Rust item is a different kind of item, so a ported line
#   has to change shape. A class becomes a variant of an enum, a method, or
#   a macro; an exception class becomes a variant of `Error`. An adapted
#   name must carry a `note` that says what takes its place.

[names]
query = { rust = "claude_agent_rust_sdk::query", note = "Returns a `Stream` of `Result<Message, Error>`." }
__version__ = { rust = "claude_agent_rust_sdk::VERSION" }
