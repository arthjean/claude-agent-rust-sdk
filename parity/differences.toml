python = "`Exception(response.get(\"error\", \"Unknown error\"))`: a `null` reads as the text `None`, and an object as its Python `repr`."
rust = "A `null` reads as `Unknown error`, the text upstream gives a response with no `error`, and any other value as its JSON text."
ref = "src/claude_agent_sdk/_internal/query.py:457-460"
anchor = 'response.get("error", "Unknown error")'
category = "deliberate"
reason = "`None` and a Python `repr` are artifacts of the interpreter, not text the CLI sent; the JSON text keeps what it sent readable."
test = "crates/claude-agent-rust-sdk/tests/control_protocol.rs::error_responses_fail_the_request_with_the_text_of_the_cli"

[behavior.flat-error-enum]
summary = "An error caught by its parent class"
python = "`ResultError` subclasses `ProcessError` and `CLINotFoundError` subclasses `CLIConnectionError`, so `except ProcessError` also catches a result error."
rust = "One `Error` type with a flat `ErrorKind`: a `match` arm on `ErrorKind::Process` misses `ErrorKind::ResultError`. `Error::is_process()` and `Error::is_cli_connection()` answer what the two `except` clauses catch."
ref = "src/claude_agent_sdk/_errors.py:10-56"
anchor = "class CLINotFoundError(CLIConnectionError):"
category = "deliberate"
reason = "A Rust enum has no subclasses; the predicates keep the Python meaning without nesting kinds."
test = "crates/claude-agent-rust-sdk/tests/errors.rs::result_error_is_a_process_failure_and_cli_not_found_a_connection_failure"

[behavior.separate-process-group]
summary = "Where the CLI process is placed"
python = "The CLI is spawned in the process group of the program, and on Windows in its console, so a Ctrl+C in the terminal reaches it directly."
rust = "On Unix the CLI leads its own process group; on Windows it starts with `CREATE_NO_WINDOW | CREATE_NEW_PROCESS_GROUP`, so no console window opens for it and it has a console process group of its own. A terminal Ctrl+C reaches it on neither; the session ends through the transport instead. On Unix the group is in the background of the terminal of the program: a tool the CLI runs that reads `/dev/tty` (a `sudo` or `ssh` prompt) is stopped by `SIGTTIN` instead of prompting, as measured under a pseudo-terminal (state `T` against `S` for a child of the program's own group). Closing the session still ends such a tool at once: the `SIGTERM` to the group is followed by `SIGCONT`."
ref = "src/claude_agent_sdk/_internal/transport/subprocess_cli.py:828-836"
anchor = "self._process = await anyio.open_process("
category = "deliberate"
reason = "A group of its own lets the SDK end the CLI and every process it started in one signal. The CLI of a session reads its prompts from a pipe, not the terminal, so only a tool that opens the terminal itself is affected; in the same group it would read the keystrokes of the program's own terminal interface."
test = "crates/claude-agent-rust-sdk/tests/shutdown.rs::the_process_leads_its_own_process_group @unix"

[behavior.process-tree-ended]
summary = "Processes the CLI started"
python = "Only the direct child is signaled, and an atexit hook cleans up at interpreter exit."
rust = "The CLI and its descendants end with the session: a Job Object on Windows, the process group on Unix, a parent-death signal on Linux. A process the agent starts in the background (`nohup server &`) is in that tree and ends with the session too, unless it leaves the group (`setsid`). On Unix, what is left in the group when the CLI exits gets `SIGTERM`, then `SIGKILL` 5 s later if it is still running, so it can clean up; on Windows the job is terminated at once. When the runtime stops with a session open, or the program leaves through `exit` (returning from `main`, `std::process::exit`) without closing it, the Unix group gets `SIGTERM`, as the Python atexit hook sends to the child; an abort runs no hook in either SDK."
ref = "src/claude_agent_sdk/_internal/transport/subprocess_cli.py:72-82"
anchor = "p.send_signal(signal.SIGTERM)"
category = "rust-more-robust"
reason = "A tool process the CLI started must not outlive the session, and a stdio MCP server or a tool process that a CLI killed by a signal could not stop would otherwise be orphaned; the grace period gives a background server the time the CLI itself gets to clean up."
test = "crates/claude-agent-rust-sdk/tests/shutdown.rs::descendants_end_with_the_session"

[behavior.shadow-warning-per-session]
summary = "The warning that `can_use_tool` is shadowed"
python = "Emitted once per process with `warnings.warn`, under the filterable category `CanUseToolShadowedWarning`."
rust = "Logged through `tracing` at each connect, once the options pass validation as upstream checks them first, under the target `claude_agent_rust_sdk::can_use_tool_shadowed` with the field `code = \"CLAUDE_SDK_CAN_USE_TOOL_SHADOWED\"`, so a filter can drop it alone; `ClaudeAgentOptions::can_use_tool_shadowed_warning` returns the text."
ref = "src/claude_agent_sdk/types.py:2374-2380"
anchor = "warnings.warn(message, CanUseToolShadowedWarning, stacklevel=2)"
category = "deliberate"
reason = "Rust has no warning categories: the target plays that part, and a log line per session names the session that is affected."
