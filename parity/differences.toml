category = "rust-more-robust"
ref = "src/claude_agent_sdk/_internal/message_parser.py:168-209"
anchor = 'match block["type"]:'
reason = "A content block of a type this version does not know is kept as `ContentBlock::Unknown`, where the Python parser drops it from the list: a newer CLI must not make an older program lose data."

