# Tests ledger: every unit test of the upstream SDK
# (upstream/claude-agent-sdk-python/tests) with the Rust tests that assert
# the same behavior, or the key of an `[exclusions]` reason.
#
# A Rust test is named `<target source file>::<test name>`, as printed by
# `cargo xtask parity-tests`. A test compiled on one platform only carries a
# ` @windows`, ` @unix`, ` @linux`, or ` @macos` suffix: on that platform it
# is checked against the compiled tests, on the others against the sources
# of its target, which must declare a function of that name.
#
# `cargo xtask parity-check` fails when upstream has a test this file does
# not list, and when a Rust test named here does not exist.

[exclusions]
python-runtime = "Exercises anyio or trio backends, the asyncio event loop, cancel scopes, task groups, thread affinity, or garbage collection, which have no tokio counterpart."
python-typing = "Checks Python typing, dataclass, TypedDict, import, or runtime type-validation behavior that the Rust compiler enforces."
python-mcp-library = "Tests the bridge to the Python `mcp` package; the native dispatcher and the `rmcp` bridge have their own tests."
python-aliasing = "Checks defensive copies of shared mutable objects, which Rust ownership rules out."
python-pickle = "Checks pickling and copying of exception objects."
python-warnings = "Checks the filter and deduplication mechanics of the Python `warnings` module."
python-atexit-registry = "Tests the registry of live children and its atexit reaper; the port ends children with a Job Object or a parent-death signal and keeps no registry."
python-exception-guard = "Checks that an exception patched into an internal function is swallowed; the Rust function cannot fail by its signature."
no-sdk-code = "Asserts only on literals defined in the test file and calls no SDK code."
packaging = "Tests the wheel build, the bundled CLI, the CLI download, or the release scripts; distribution is a non-goal of this PRD."
example-store-adapters = "Tests the Postgres, Redis, and S3 reference adapters, which are not ported (non-goal)."
derived-client-app = "Tests the derived client-application label, which is not ported (non-goal); only the explicit `client_app` option is."
upstream-repository = "Checks files of the upstream repository itself."

