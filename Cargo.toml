[workspace]
resolver = "3"
members = [
    "crates/claude-agent-kit",
    "crates/claude-agent-kit-macros",
    "crates/fake-claude",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
authors = ["Arthur Jean"]

[workspace.dependencies]
indexmap = { version = "2.7", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0"
tokio = "1.54"

[workspace.lints.clippy]
panic         = "deny"
unimplemented = "deny"
dbg_macro     = "deny"
todo          = "warn"
unwrap_used   = "warn"
expect_used   = "warn"
