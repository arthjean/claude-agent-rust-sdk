[workspace]
resolver = "3"
members = [
    "crates/claude-agent-kit",
    "crates/claude-agent-kit-macros",
    "crates/fake-claude",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
authors = ["Arthur Jean"]

[workspace.dependencies]
futures-core = "0.3.31"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
indexmap = { version = "2.13", features = ["serde"] }
jsonschema = { version = "0.61", default-features = false }
libc = "0.2.183"
opentelemetry = { version = "0.33", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace"] }
proc-macro2 = "1.0.91"
quote = "1.0.35"
rmcp = { version = "3.10", default-features = false, features = ["server"] }
schemars = "1.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
syn = { version = "3.0", features = ["full"] }
tempfile = "3.20"
thiserror = "2.0"
toml = { version = "1.2", default-features = false, features = ["std", "serde", "parse"] }
tokio = "1.54"
trybuild = "1.0.122"
tracing = { version = "0.1.40", default-features = false, features = ["std"] }
unicode-normalization = "0.1.26"
unicode-properties = { version = "0.1.5", default-features = false, features = ["general-category"] }
uuid = { version = "1", features = ["v4"] }
windows-sys = "0.61"

[workspace.lints.clippy]
panic         = "deny"
unimplemented = "deny"
dbg_macro     = "deny"
todo          = "warn"
unwrap_used   = "warn"
expect_used   = "warn"
