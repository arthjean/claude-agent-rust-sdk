[graph]
all-features = true

[licenses]
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "Zlib",
    "Unicode-3.0",
]
confidence-threshold = 0.8

# Every crate comes from crates.io: a git or other registry source is
# refused, so a dependency cannot bypass the registry and its yanking.
[sources]
unknown-registry = "deny"
unknown-git = "deny"

# A wildcard requirement (`*`) is refused; it would let any version in. A
# bare path dependency of an unpublished workspace crate is not one.
# Duplicate versions are reported, not refused: syn 2 and 3 and their
# like come from dependencies this crate does not control.
[bans]
wildcards = "deny"
allow-wildcard-paths = true
multiple-versions = "warn"

# Read by the `Advisories` workflow (.github/workflows/advisories.yml), which
# fails on any advisory that affects a crate of Cargo.lock: vulnerabilities,
# unsound code, unmaintained crates, and yanked versions. An entry of
# `ignore` names one advisory, with the reason it does not apply or cannot be
# acted on; remove it once the cause is gone.
[advisories]
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained with no successor release; it reaches the workspace only through rmcp and schemars, which depend on it, so the fix is their move to another date crate" },
]
