name: Release

# Publishes a version pushed as a tag by the owner (`cargo xtask release
# tag`, then the push command it prints). It checks that the
# tag, the workspace version, and the changelog agree, reruns the whole CI on
# the tagged commit, publishes both crates through crates.io trusted
# publishing, attests the archives the registry serves, and creates the
# GitHub Release. No step commits, tags, or pushes, and no stored registry
# token exists. The decisions are in .github/scripts/release.sh, tested
# offline by the `scripts` job of ci.yml.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: read

# One release at a time; a running release is never cancelled.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Tag, version, and changelog agree
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.verify.outputs.version }}
    steps:
      # The full history, so the script can tell whether the tag is on main.
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Verify the tag
        id: verify
        run: bash .github/scripts/release.sh verify "$TAG" "$RUNNER_TEMP/release-notes.md"
        env:
          TAG: ${{ github.ref_name }}

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes.md

  ci:
    name: CI on the tagged commit
    needs: verify
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # The only job in the `release` environment and the only one that can
  # obtain a registry token. It restores no cache.
  publish:
    name: Publish to crates.io
    needs: [verify, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # The jobs that can mint an identity token run no third-party action but
      # the token exchange and the attestation: rustup comes with the runner.
      - name: Install the stable toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      # A token is obtained only when a crate is left to publish: a rerun
      # after success, or a version published by hand (the first one), never
      # mints one.
      - name: Look up the crates missing from the registry
        id: missing
        run: bash .github/scripts/release.sh missing

      - name: Exchange the job identity for a short-lived token
        id: auth
        if: steps.missing.outputs.publish == 'true'
        uses: rust-lang/crates-io-auth-action@v1.0.6

      - name: Publish the crates missing from the registry
        if: steps.missing.outputs.publish == 'true'
        run: bash .github/scripts/release.sh publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  attest:
    name: Attest the published archives
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install the stable toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Download the archives crates.io serves
        run: bash .github/scripts/release.sh download dist

      - uses: actions/attest@v4.2.2
        with:
          subject-path: dist/*.crate

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: crates
          path: dist/*.crate

  # The only job that can write to the repository: it runs no build, only
  # the release lookup and its creation.
  github-release:
    name: GitHub Release
    needs: [verify, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes

      - uses: actions/download-artifact@v8.0.2
        with:
          name: crates
          path: ${{ runner.temp }}/dist

      - name: Create the release unless it exists
        run: bash .github/scripts/release.sh github-release "$TAG" "$RUNNER_TEMP/notes/release-notes.md" "$RUNNER_TEMP/dist"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
