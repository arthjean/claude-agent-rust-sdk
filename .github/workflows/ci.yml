name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  gates:
    name: Quality gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features --no-deps

      - name: Test
        run: cargo test --workspace --all-features

      - name: Keychain resume (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          keychain="$RUNNER_TEMP/claude-agent-kit-test.keychain-db"
          security create-keychain -p ci-only "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p ci-only "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security add-generic-password -U -T /usr/bin/security -a "$USER" -s "Claude Code-credentials" \
            -w '{"claudeAiOauth":{"accessToken":"ci-access","refreshToken":"ci-refresh"}}' "$keychain"
          trap 'security delete-keychain "$keychain"' EXIT
          unset CLAUDE_CONFIG_DIR ANTHROPIC_API_KEY CLAUDE_CODE_OAUTH_TOKEN
          CLAUDE_AGENT_KIT_KEYCHAIN=1 cargo test -p claude-agent-kit --all-features --test session_resume \
            keychain -- --ignored --nocapture

      - name: Documentation
        run: cargo doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.88.0

      - uses: Swatinem/rust-cache@v2

      - name: Check
        run: cargo check --workspace --all-features --locked

  licenses:
    name: Dependency licenses
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses

  parity:
    name: Parity ledgers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Parity check
        run: cargo xtask parity-check --deny-pending
