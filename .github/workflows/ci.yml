name: CI

on:
  pull_request:
  push:
    branches:
      - main
  # release.yml runs the whole CI on the tagged commit before publishing.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  gates:
    name: Quality gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2.9.3

      - name: Format
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features --no-deps -- -D warnings

      - name: Examples (default features)
        run: cargo check --package claude-agent-rust-sdk --examples

      - name: Test
        run: cargo test --workspace --all-features

      - name: Test (no default features)
        run: cargo test --package claude-agent-rust-sdk --no-default-features --features testing

      - name: Keychain resume (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          keychain="$RUNNER_TEMP/claude-agent-rust-sdk-test.keychain-db"
          security create-keychain -p ci-only "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p ci-only "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security add-generic-password -U -T /usr/bin/security -a "$USER" -s "Claude Code-credentials" \
            -w '{"claudeAiOauth":{"accessToken":"ci-access","refreshToken":"ci-refresh"}}' "$keychain"
          trap 'security delete-keychain "$keychain"' EXIT
          unset CLAUDE_CONFIG_DIR ANTHROPIC_API_KEY CLAUDE_CODE_OAUTH_TOKEN
          CLAUDE_AGENT_RUST_SDK_KEYCHAIN=1 cargo test -p claude-agent-rust-sdk --all-features --test session_resume \
            keychain -- --ignored --nocapture

      - name: Documentation
        run: cargo doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    name: Minimum supported Rust version (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.88.0

      - uses: Swatinem/rust-cache@v2.9.3

      - name: Check
        run: cargo check --workspace --all-features --locked

  # Packages both published crates as a release does and checks what the
  # archives hold, then builds the documentation the way docs.rs does.
  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # Nightly builds the documentation; the stable toolchain, installed
      # last, stays the default and packages the crates.
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2.9.3

      - name: Package check
        run: cargo xtask package-check

      - name: Documentation as docs.rs builds it
        run: cargo +nightly doc --package claude-agent-rust-sdk --all-features --no-deps
        env:
          RUSTDOCFLAGS: --cfg docsrs -D warnings

  # Compares the public API of the library with its newest non-yanked
  # release on crates.io, and fails on a break that the workspace version
  # does not allow (in 0.y.z, only a change of y may break). The logic, the
  # pins, and the failure messages are in xtask/src/semver.rs.
  semver:
    name: API compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # cargo-semver-checks reads the rustdoc JSON of this toolchain, whose
      # format changes with Rust releases: the tool and the toolchain move
      # together, here and in xtask/src/semver.rs.
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.100.0

      - uses: Swatinem/rust-cache@v2.9.3

      - name: Install cargo-semver-checks
        run: cargo install cargo-semver-checks@0.51.0 --locked

      # Every feature but `testing`, whose test doubles are outside the
      # compatibility promise. The macros crate is left out: its only public
      # item is the `tool` attribute, which the library re-exports under
      # `macros` and requires at the exact same version, and rustdoc
      # describes a procedural macro by its name only.
      - name: Compare with the newest release
        run: cargo xtask semver-check --features jsonschema,macros,otel,preserve-order,rmcp

  licenses:
    name: Dependency licenses
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          command: check licenses

  # Each platform lists the tests it compiles and checks the ones the
  # ledgers mark for another platform against the sources, so every
  # platform suffix is checked where it is compiled.
  parity:
    name: Parity ledgers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2.9.3

      - name: Parity check
        run: cargo xtask parity-check --deny-pending

  # Plays every case of parity/cases through both SDKs against fake-claude
  # and fails on any difference parity/differences.toml does not list. The
  # Python SDK is not installed: the harness imports it from the submodule
  # by setting PYTHONPATH to upstream/claude-agent-sdk-python/src for the
  # Python driver. Only its dependencies are installed, from hashed pins.
  differential:
    name: Differential parity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2.9.3

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"

      - name: Python pins agree with upstream
        run: cargo xtask parity-diff --check-requirements

      - name: Install the Python dependencies
        run: |
          python -m venv "$RUNNER_TEMP/parity-venv"
          "$RUNNER_TEMP/parity-venv/bin/python" -m pip install --require-hashes --no-deps -r parity/requirements.txt

      - name: Differential cases
        run: cargo xtask parity-diff
        env:
          PARITY_PYTHON: ${{ runner.temp }}/parity-venv/bin/python

      # Plays each case again without each option it sets, to tell an
      # option whose effect a case observes from one it only sets.
      - name: Option coverage
        run: cargo xtask parity-diff --coverage
        env:
          PARITY_PYTHON: ${{ runner.temp }}/parity-venv/bin/python

  minimal-versions:
    name: Minimum dependency versions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      # Nightly cargo resolves the lockfile; the stable toolchain, installed
      # last, stays the default and runs the tests.
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2.9.3

      - name: Resolve direct dependencies to their declared minimums
        run: cargo +nightly update -Z direct-minimal-versions

      - name: Test
        run: cargo test --workspace --all-features --locked

  coverage:
    name: Test coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The test stand-in, the parity driver, and the maintenance tasks are
      # not part of the SDK.
      COVERAGE_IGNORE: (crates/fake-claude|crates/parity-driver|xtask)/
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2.9.3

      - uses: taiki-e/install-action@v2.90.3
        with:
          tool: cargo-llvm-cov@0.9.1

      - name: Test with coverage
        run: cargo llvm-cov --workspace --all-features --no-report

      - name: Coverage summary
        run: |
          {
            echo '```text'
            cargo llvm-cov report --ignore-filename-regex "$COVERAGE_IGNORE"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: HTML report
        run: cargo llvm-cov report --html --output-dir target/coverage --ignore-filename-regex "$COVERAGE_IGNORE"

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-html
          path: target/coverage/html

      # A floor, not a target: raise it when coverage climbs, and never lower
      # it to make a change pass. It runs last so that a failure still leaves
      # the summary and the HTML report.
      - name: Coverage floor
        run: cargo llvm-cov report --fail-under-lines 91.5 --ignore-filename-regex "$COVERAGE_IGNORE"

  scripts:
    name: Workflow scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # Offline: `gh` is replaced by a stand-in, so no token is needed.
      - name: Test the action freshness script
        run: bash .github/scripts/actions-freshness.test.sh

      - name: Test the upstream watch script
        run: bash .github/scripts/upstream-watch.test.sh

      - name: Test the release script
        run: bash .github/scripts/release.test.sh

  lockfile:
    name: Workflow lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install the lockfile extension
        run: gh extension install github/gh-actions-lock --pin v0.4.1

      # Fails when actions.lock no longer matches the workflows, or when a
      # locked commit can no longer be verified in the repository of its action.
      - name: Verify the lockfile
        run: gh actions-lock --verify

  offline-cli:
    name: Real CLI without the API
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLAUDE_CODE_VERSION: 2.1.329
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2.9.3

      - name: Install Claude Code
        shell: bash
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s "$CLAUDE_CODE_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify Claude Code installation
        shell: bash
        run: |
          installed="$(claude -v)"
          echo "$installed"
          case "$installed" in
            "$CLAUDE_CODE_VERSION "*|"$CLAUDE_CODE_VERSION") ;;
            *) echo "expected Claude Code $CLAUDE_CODE_VERSION" >&2; exit 1 ;;
          esac

      # No credentials: the CLI runs with a placeholder key and an API base
      # URL on a closed local port, so no request reaches the API.
      - name: Handshake, options, and init data against the pinned CLI
        run: cargo test -p claude-agent-rust-sdk --all-features --test offline_cli -- --ignored

      - name: Project directory names against the pinned CLI
        run: >-
          cargo test -p claude-agent-rust-sdk --all-features --test project_dir_naming
          project_directory_naming_matches_the_cli_without_calling_the_api -- --ignored --nocapture
