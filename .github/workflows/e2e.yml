name: End-to-end

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CLAUDE_CODE_VERSION: 2.1.329

jobs:
  e2e:
    name: End-to-end suite (real CLI)
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2.9.3

      - name: Unit and integration tests
        run: cargo test --workspace --all-features

      - name: Install Claude Code
        shell: bash
        run: |
          bash .github/scripts/install-cli.sh "$CLAUDE_CODE_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify Claude Code installation
        shell: bash
        run: |
          installed="$(claude -v)"
          echo "$installed"
          case "$installed" in
            "$CLAUDE_CODE_VERSION "*|"$CLAUDE_CODE_VERSION") ;;
            *) echo "expected Claude Code $CLAUDE_CODE_VERSION" >&2; exit 1 ;;
          esac

      - name: End-to-end suite
        run: cargo xtask e2e
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
