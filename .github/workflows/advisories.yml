name: Advisories

# Runs every Monday and on request. Fails when an advisory of the RustSec
# database affects a crate of Cargo.lock (a vulnerability, unsound code, an
# unmaintained crate, or a yanked version), naming the advisory, and fails
# as well when the database cannot be fetched, so a red run is never
# mistaken for a clean one. The policy is the `[advisories]` section of
# deny.toml; RELEASING.md says what to do on a failure. Opens no issue and
# makes no commit: GitHub's failure notification reaches the maintainer.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisories:
    name: Dependency advisories
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          command: check advisories
